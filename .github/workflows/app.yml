name: Build App
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # take the most recently uploaded Phonebook*.zip, whatever its exact name
          ZIP=""; BEST=0
          for f in Phonebook*.zip; do
            [ -f "$f" ] || continue
            t=$(git log -1 --format=%ct -- "$f")
            if [ "${t:-0}" -ge "$BEST" ]; then BEST=$t; ZIP="$f"; fi
          done
          echo "Using: $ZIP"
          rm -rf work && mkdir work && unzip -q "$ZIP" -d work
          cd work/Phonebook
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          EXTRA=""
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            EXTRA="-PuploadKeystore=$RUNNER_TEMP/upload.jks"
          fi
          ./gradlew bundleRelease assembleRelease --no-daemon -PversionCode=$((100 + ${{ github.run_number }})) $EXTRA
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/phonebook.aab"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/phonebook.apk"
          cp PRIVACY.md "$GITHUB_WORKSPACE/PRIVACY.md"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag --repo ${{ github.repository }} || true
          gh release create app phonebook.apk phonebook.aab --repo ${{ github.repository }} --title "Phonebook ${{ github.run_number }}" --notes "Build ${{ github.run_number }}"
      - name: Privacy policy page
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add PRIVACY.md
          git diff --cached --quiet || (git commit -m "Update privacy policy [skip ci]" && git push)
